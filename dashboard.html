<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Notícias</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-hover: #1e222b;
    --border: #262b36;
    --text: #e8e9ec;
    --text-dim: #8b8f9c;
    --accent: #ffb020;
    --accent-dim: #4a3a1a;
    --star-off: #3a3f4b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding: 40px 24px 80px;
  }

  header {
    max-width: 1100px;
    margin: 0 auto 32px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 2.4rem;
    margin: 0;
    letter-spacing: -0.5px;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 0.95rem;
    margin-top: 6px;
  }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  select, input[type="text"], button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
  }

  input[type="text"] { min-width: 200px; }

  button {
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  button:hover { background: var(--panel-hover); border-color: var(--accent); }

  button.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  #status {
    max-width: 1100px;
    margin: 0 auto 24px;
    color: var(--text-dim);
    font-size: 0.9rem;
  }

  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    transition: border-color 0.15s, transform 0.15s;
  }

  .card:hover { border-color: #3a3f4b; transform: translateY(-2px); }

  .card.favorited { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .fonte-tag {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    background: #1c2029;
    padding: 4px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }

  .star-btn {
    background: none;
    border: none;
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    color: var(--star-off);
    padding: 0;
  }

  .star-btn.on { color: var(--accent); }

  .titulo {
    font-family: 'Fraunces', serif;
    font-size: 1.15rem;
    font-weight: 500;
    line-height: 1.3;
    margin: 0;
  }

  .titulo a { color: var(--text); text-decoration: none; }
  .titulo a:hover { color: var(--accent); }

  .meta {
    font-size: 0.78rem;
    color: var(--text-dim);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .resumo {
    font-size: 0.85rem;
    color: #b7bac2;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .categoria-pill {
    display: inline-block;
    font-size: 0.7rem;
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    padding: 2px 8px;
    border-radius: 100px;
    width: fit-content;
  }

  .empty, .error {
    max-width: 1100px;
    margin: 60px auto;
    text-align: center;
    color: var(--text-dim);
  }

  .error { color: #e88; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Radar de Notícias</h1>
    <div class="subtitle" id="subtitle">Carregando…</div>
  </div>
  <div class="controls">
    <input type="text" id="busca" placeholder="Buscar por título…">
    <select id="filtroFonte"><option value="">Todas as fontes</option></select>
    <button id="btnSoFavoritas">★ Só favoritas</button>
    <button id="btnAtualizar">↻ Atualizar</button>
  </div>
</header>

<div id="status"></div>
<div class="grid" id="grid"></div>

<script>
  const API_URL = "https://seu-app.onrender.com/noticias";
  let todasNoticias = [];
  let favoritos = new Set(JSON.parse(localStorage.getItem("favoritos_noticias") || "[]"));
  let mostrarSoFavoritas = false;

  const grid = document.getElementById("grid");
  const status = document.getElementById("status");
  const subtitle = document.getElementById("subtitle");
  const busca = document.getElementById("busca");
  const filtroFonte = document.getElementById("filtroFonte");
  const btnSoFavoritas = document.getElementById("btnSoFavoritas");
  const btnAtualizar = document.getElementById("btnAtualizar");

  function salvarFavoritos() {
    localStorage.setItem("favoritos_noticias", JSON.stringify([...favoritos]));
  }

  function formatarData(dataStr) {
    if (!dataStr) return "Sem data";
    const d = new Date(dataStr);
    if (isNaN(d)) return dataStr;
    return d.toLocaleString("pt-BR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
  }

  function extrairFonte(link) {
    try { return new URL(link).hostname.replace("www.", ""); }
    catch { return "fonte desconhecida"; }
  }

  function renderizar() {
    const termo = busca.value.trim().toLowerCase();
    const fonteSelecionada = filtroFonte.value;

    let lista = todasNoticias.filter(n => {
      const bateBusca = !termo || (n.titulo || "").toLowerCase().includes(termo);
      const bateFonte = !fonteSelecionada || extrairFonte(n.link) === fonteSelecionada;
      const bateFavorito = !mostrarSoFavoritas || favoritos.has(n.id);
      return bateBusca && bateFonte && bateFavorito;
    });

    lista.sort((a, b) => new Date(b.data) - new Date(a.data));

    grid.innerHTML = "";

    if (lista.length === 0) {
      grid.innerHTML = `<div class="empty">Nenhuma notícia encontrada com esses filtros.</div>`;
      return;
    }

    lista.forEach(n => {
      const isFav = favoritos.has(n.id);
      const card = document.createElement("div");
      card.className = "card" + (isFav ? " favorited" : "");
      card.innerHTML = `
        <div class="card-top">
          <span class="fonte-tag">${extrairFonte(n.link)}</span>
          <button class="star-btn ${isFav ? "on" : ""}" data-id="${n.id}">★</button>
        </div>
        <h3 class="titulo"><a href="${n.link}" target="_blank" rel="noopener">${n.titulo || "Sem título"}</a></h3>
        <div class="meta">
          <span>${formatarData(n.data)}</span>
          <span>${n.autor || "Autor não informado"}</span>
        </div>
        ${n.categoria ? `<span class="categoria-pill">${n.categoria}</span>` : ""}
      `;
      grid.appendChild(card);
    });

    grid.querySelectorAll(".star-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = parseInt(btn.dataset.id, 10);
        if (favoritos.has(id)) favoritos.delete(id);
        else favoritos.add(id);
        salvarFavoritos();
        renderizar();
      });
    });
  }

  function popularFiltroFontes() {
    const fontes = [...new Set(todasNoticias.map(n => extrairFonte(n.link)))].sort();
    filtroFonte.innerHTML = `<option value="">Todas as fontes</option>` +
      fontes.map(f => `<option value="${f}">${f}</option>`).join("");
  }

  async function carregar() {
    status.textContent = "Carregando notícias…";
    try {
      const resp = await fetch(API_URL);
      if (!resp.ok) throw new Error(`Erro ${resp.status}`);
      todasNoticias = await resp.json();
      subtitle.textContent = `${todasNoticias.length} notícias coletadas`;
      status.textContent = "";
      popularFiltroFontes();
      renderizar();
    } catch (err) {
      status.innerHTML = `<div class="error">Não consegui carregar as notícias: ${err.message}. Confirme que a API está rodando em ${API_URL} e que o CORS está liberado (veja as instruções abaixo do arquivo).</div>`;
    }
  }

  busca.addEventListener("input", renderizar);
  filtroFonte.addEventListener("change", renderizar);
  btnAtualizar.addEventListener("click", carregar);
  btnSoFavoritas.addEventListener("click", () => {
    mostrarSoFavoritas = !mostrarSoFavoritas;
    btnSoFavoritas.classList.toggle("active", mostrarSoFavoritas);
    renderizar();
  });

  carregar();
</script>
</body>
</html>
